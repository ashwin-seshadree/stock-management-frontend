<nav aria-label="Page navigation example" class="d-flex justify-content-between align-items-center p-2">
    <span>Showing {{ startIndex }} to {{ endIndex }} of {{ totalItems }}</span>
    <ul class="pagination mb-0">
        <li class="page-item" [class.disabled]="currentPage === 1">
            <a class="page-link" (click)="onPrevious()"><i class="bi bi-caret-left-fill"></i></a>
        </li>

        <li *ngFor="let page of pages" class="page-item" [class.active]="currentPage === page">
            <a class="page-link" (click)="onPageChange(page)">{{ page }}</a>
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
            <a class="page-link" (click)="onNext()"><i class="bi bi-caret-right-fill"></i></a>
        </li>
    </ul>
</nav>
