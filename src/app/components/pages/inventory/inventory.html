<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item active">{{title}}</li>
    </ol>
</nav>

<section>
    <div class="container-fluid content-pane">
        <div class="row">
            <div class="col-12">
                <h1>{{title}}</h1>
            </div>
        </div>
        <div class="col-12 mt-4">
            <table class="table table-striped table-hover table-bordered">
                <thead>
                    <tr>
                        <th scope="col">Product Name</th>
                        <th scope="col">Description</th>
                        <th scope="col">Price</th>
                        <th scope="col">In Stock</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of inventoryList | async" class="text-start">
                        <td scope="row">{{item?.product_name}}<span
                                class="badge badge-primary ms-2">{{item.product_weight}}</span></td>
                        <td>{{item?.product_description}}</td>
                        <td>INR. {{item?.product_price}}</td>
                        <td>{{item?.product_quantity}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
